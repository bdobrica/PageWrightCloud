version: '3.8'

services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, always, --no-appendfsync-on-rewrite, 'no', --aof-load-truncated, 'no', --maxmemory-policy, noeviction, --save, '']
    volumes:
      - redis_data:/data
    container_name: pagewright-redis
    ports:
      - "6379:6379"
    networks:
      - pagewright-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  manager-service:
    stop_grace_period: 65s
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pagewright-manager
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PAGEWRIGHT_PORT=8081
      - PAGEWRIGHT_QUEUE_BACKEND=redis
      - PAGEWRIGHT_WORKER_SPAWNER=docker
      - PAGEWRIGHT_REDIS_ADDR=redis:6379
      - PAGEWRIGHT_REDIS_PASSWORD=
      - PAGEWRIGHT_REDIS_DB=0
      - PAGEWRIGHT_LOCK_TTL=5m
      - PAGEWRIGHT_WORKER_IMAGE=pagewright-worker:m2.12
      - PAGEWRIGHT_WORKER_APPARMOR_PROFILE=${PAGEWRIGHT_WORKER_APPARMOR_PROFILE:-}
      - PAGEWRIGHT_WORKER_APPARMOR_PROFILE=${PAGEWRIGHT_WORKER_APPARMOR_PROFILE:-}
      - PAGEWRIGHT_WORKER_NETWORK=${COMPOSE_PROJECT_NAME:-manager}_pagewright-network
      - PAGEWRIGHT_DISPATCH_CONCURRENCY=${PAGEWRIGHT_DISPATCH_CONCURRENCY:-4}
      - PAGEWRIGHT_DISPATCH_CLAIM_TTL=${PAGEWRIGHT_DISPATCH_CLAIM_TTL:-30s}
      - PAGEWRIGHT_WORKER_STORAGE_URL=http://storage:8080
      - PAGEWRIGHT_WORKER_LLM_MODEL=${PAGEWRIGHT_WORKER_LLM_MODEL:-}
      - PAGEWRIGHT_MANAGER_URL=http://manager-service:8081
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8081:8081"
    networks:
      - pagewright-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  pagewright-network:
    driver: bridge

volumes:
  redis_data:
