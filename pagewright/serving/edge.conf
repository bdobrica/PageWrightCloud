user nginx;
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 80 default_server;
        server_name _;
        # Apply even to old managed site configs and error responses. The edge
        # is the sole published generated-content listener in root Compose.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Origin-Agent-Cluster;
        proxy_hide_header Permissions-Policy;
        # Live/preview URLs (including assets) are mutable publication pointers.
        # Filesystem mtime/size validators cannot identify the selected version.
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Origin-Agent-Cluster "?1" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
        location / {
            # Re-resolve after container replacement. This proxy never reads
            # mutable site configs and never exposes serving's management API.
            set $hosting http://serving:80;
            proxy_pass $hosting;
            proxy_set_header Host $http_host;
            # Also defeat validators cached before this policy was installed.
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
    }
}
