<!-- Props: title, text, label, href (strings) -->
<section class="pw-cta">
  <header><h2>{{ .title }}</h2></header>
  <div class="content">
    {{ if .text }}<p>{{ .text }}</p>{{ end }}
    {{ if and .label .href }}<a class="button primary" href="{{ .href }}">{{ .label }}</a>{{ end }}
  </div>
</section>
