services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pagewright
      POSTGRES_USER: pagewright
      POSTGRES_PASSWORD: pagewright
    ports:
      - "${PAGEWRIGHT_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pagewright
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagewright"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, always, --no-appendfsync-on-rewrite, 'no', --aof-load-truncated, 'no', --maxmemory-policy, noeviction, --save, '']
    volumes:
      - redis_data:/data
    ports:
      - "${PAGEWRIGHT_REDIS_PORT:-6379}:6379"
    networks:
      - pagewright
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Application Services
  gateway:
    build:
      context: ./pagewright/gateway
      dockerfile: Dockerfile
    ports:
      - "${PAGEWRIGHT_GATEWAY_PORT:-8085}:8085"
    environment:
      - PAGEWRIGHT_GATEWAY_PORT=8085
      - PAGEWRIGHT_DATABASE_URL=${PAGEWRIGHT_DATABASE_URL:-postgres://pagewright:pagewright@postgres:5432/pagewright?sslmode=disable}
      - PAGEWRIGHT_STORAGE_URL=${PAGEWRIGHT_STORAGE_URL:-http://storage:8080}
      - PAGEWRIGHT_MANAGER_URL=${PAGEWRIGHT_MANAGER_URL:-http://manager:8081}
      - PAGEWRIGHT_SERVING_URL=${PAGEWRIGHT_SERVING_URL:-http://serving:8083}
      - PAGEWRIGHT_SITE_DOMAIN=${PAGEWRIGHT_SITE_DOMAIN:-pagewright.dev}
      - PAGEWRIGHT_HOSTING_SCHEME=${PAGEWRIGHT_HOSTING_SCHEME:-http}
      - PAGEWRIGHT_HOSTING_PORT=${PAGEWRIGHT_HOSTING_PORT:-8084}
      - PAGEWRIGHT_JWT_SECRET=${PAGEWRIGHT_JWT_SECRET:-dev-secret-change-in-production}
      - PAGEWRIGHT_JWT_EXPIRATION=${PAGEWRIGHT_JWT_EXPIRATION:-15m}
      - PAGEWRIGHT_GOOGLE_CLIENT_ID=${PAGEWRIGHT_GOOGLE_CLIENT_ID:-}
      - PAGEWRIGHT_GOOGLE_CLIENT_SECRET=${PAGEWRIGHT_GOOGLE_CLIENT_SECRET:-}
      - PAGEWRIGHT_GOOGLE_REDIRECT_URL=${PAGEWRIGHT_GOOGLE_REDIRECT_URL:-http://localhost:8085/auth/google/callback}
      - PAGEWRIGHT_LLM_KEY=${PAGEWRIGHT_LLM_KEY:-}
      - PAGEWRIGHT_LLM_URL=${PAGEWRIGHT_LLM_URL:-https://api.openai.com/v1}
      - PAGEWRIGHT_SIGNUP_MODE=${PAGEWRIGHT_SIGNUP_MODE:-closed}
      - PAGEWRIGHT_USER_DAILY_BUILDS=${PAGEWRIGHT_USER_DAILY_BUILDS:-10}
      - PAGEWRIGHT_SITE_DAILY_BUILDS=${PAGEWRIGHT_SITE_DAILY_BUILDS:-5}
      - PAGEWRIGHT_ACTIVE_BUILDS=${PAGEWRIGHT_ACTIVE_BUILDS:-2}
      - PAGEWRIGHT_AI_ALLOWANCE_CENTS=${PAGEWRIGHT_AI_ALLOWANCE_CENTS:-0}
      - PAGEWRIGHT_PROVIDER_TOKEN=${PAGEWRIGHT_PROVIDER_TOKEN:-}
      - PAGEWRIGHT_DEFAULT_PAGE_SIZE=${PAGEWRIGHT_DEFAULT_PAGE_SIZE:-25}
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      manager:
        condition: service_healthy
      serving:
        condition: service_healthy
    networks:
      - pagewright
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  manager:
    stop_grace_period: 65s
    build:
      context: ./pagewright/manager
      dockerfile: Dockerfile
    ports:
      - "${PAGEWRIGHT_MANAGER_PORT:-8081}:8081"
    environment:
      - PAGEWRIGHT_PORT=8081
      - PAGEWRIGHT_QUEUE_BACKEND=${PAGEWRIGHT_QUEUE_BACKEND:-redis}
      - PAGEWRIGHT_WORKER_SPAWNER=${PAGEWRIGHT_WORKER_SPAWNER:-docker}
      - PAGEWRIGHT_REDIS_ADDR=${PAGEWRIGHT_REDIS_ADDR:-redis:6379}
      - PAGEWRIGHT_REDIS_PASSWORD=${PAGEWRIGHT_REDIS_PASSWORD:-}
      - PAGEWRIGHT_REDIS_DB=${PAGEWRIGHT_REDIS_DB:-0}
      - PAGEWRIGHT_LOCK_TTL=${PAGEWRIGHT_LOCK_TTL:-5m}
      - PAGEWRIGHT_LOCK_RENEW_INTERVAL=${PAGEWRIGHT_LOCK_RENEW_INTERVAL:-1m}
      - PAGEWRIGHT_WORKER_IMAGE=${PAGEWRIGHT_WORKER_IMAGE:-pagewright-worker:m2.12}
      - PAGEWRIGHT_WORKER_APPARMOR_PROFILE=${PAGEWRIGHT_WORKER_APPARMOR_PROFILE:-}
      - PAGEWRIGHT_WORKER_NETWORK=${COMPOSE_PROJECT_NAME:-pagewrightcloud}_pagewright
      - PAGEWRIGHT_WORKER_WORK_DIR=/work
      - PAGEWRIGHT_WORKER_STORAGE_URL=http://storage:8080
      - PAGEWRIGHT_WORKER_LLM_KEY=${PAGEWRIGHT_PROVIDER_TOKEN:-}
      - PAGEWRIGHT_WORKER_LLM_URL=http://gateway:8087/v1
      - PAGEWRIGHT_WORKER_LLM_MODEL=gpt-5.6-luna
      - PAGEWRIGHT_WORKER_TIMEOUT=${PAGEWRIGHT_WORKER_TIMEOUT:-30m}
      - PAGEWRIGHT_DISPATCH_CONCURRENCY=${PAGEWRIGHT_ACTIVE_BUILDS:-2}
      - PAGEWRIGHT_DISPATCH_CLAIM_TTL=${PAGEWRIGHT_DISPATCH_CLAIM_TTL:-30s}
      - PAGEWRIGHT_MANAGER_URL=${PAGEWRIGHT_MANAGER_URL:-http://manager:8081}
    # Manager-only daemon access. Never passed to spawned workers.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pagewright
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  storage:
    build:
      context: ./pagewright/storage
      dockerfile: Dockerfile
    ports:
      - "${PAGEWRIGHT_STORAGE_PORT:-8080}:8080"
    environment:
      - PAGEWRIGHT_PORT=8080
      - PAGEWRIGHT_STORAGE_BACKEND=${PAGEWRIGHT_STORAGE_BACKEND:-nfs}
      - PAGEWRIGHT_NFS_BASE_PATH=/nfs
      - PAGEWRIGHT_MANAGER_URL=http://manager:8081
    volumes:
      - nfs_data:/nfs
    networks:
      - pagewright
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  serving:
    stop_grace_period: 20s
    build:
      context: ./pagewright/serving
      dockerfile: Dockerfile
    ports:
      - "${PAGEWRIGHT_SERVING_PORT:-8083}:8083"
    environment:
      - PAGEWRIGHT_SERVING_PORT=8083
      - PAGEWRIGHT_WWW_ROOT=${PAGEWRIGHT_WWW_ROOT:-/var/www}
      - PAGEWRIGHT_NGINX_SITES_ENABLED=${PAGEWRIGHT_NGINX_SITES_ENABLED:-/etc/nginx/sites-enabled}
      - PAGEWRIGHT_NGINX_RELOAD_COMMAND=${PAGEWRIGHT_NGINX_RELOAD_COMMAND:-nginx -s reload}
      - PAGEWRIGHT_STORAGE_URL=${PAGEWRIGHT_STORAGE_URL:-http://storage:8080}
      - PAGEWRIGHT_MAX_VERSIONS_PER_SITE=${PAGEWRIGHT_MAX_VERSIONS_PER_SITE:-10}
      - PAGEWRIGHT_MAINTENANCE_PAGE_PATH=${PAGEWRIGHT_MAINTENANCE_PAGE_PATH:-/etc/pagewright/503.html}
    volumes:
      - www_data:/var/www
      - nginx_config:/etc/nginx/sites-enabled
      - pagewright_config:/etc/pagewright
    depends_on:
      storage:
        condition: service_healthy
    networks:
      - pagewright
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  themes:
    build:
      context: ./pagewright/themes
      dockerfile: Dockerfile
    ports:
      - "${PAGEWRIGHT_THEMES_PORT:-8086}:80"
    networks:
      - pagewright
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    ports:
      - "${PAGEWRIGHT_NGINX_PORT:-8084}:80"
    volumes:
      - ./pagewright/serving/edge.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      serving:
        condition: service_healthy
    networks:
      - pagewright
    restart: unless-stopped

  ui:
    build:
      context: ./pagewright/ui
      dockerfile: Dockerfile
      args:
        VITE_PAGEWRIGHT_API_URL: ${VITE_PAGEWRIGHT_API_URL:-http://localhost:8085}
    ports:
      - "${PAGEWRIGHT_UI_PORT:-3000}:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - pagewright
    restart: unless-stopped

  # Worker (optional - use with --profile worker)
  worker:
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    read_only: true
    init: true
    shm_size: 16m
    ulimits:
      nofile: {soft: 1024, hard: 1024}
      core: 0
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "2"}
    image: ${PAGEWRIGHT_WORKER_IMAGE:-pagewright-worker:m2.12}
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./pagewright/manager/internal/spawner/docker/seccomp-worker.json
    tmpfs:
      - /work:rw,nosuid,nodev,size=268435456,mode=0700,uid=1000,gid=1000
      - /tmp:rw,nosuid,nodev,noexec,size=67108864,mode=1777
    build:
      context: .
      dockerfile: pagewright/worker/Dockerfile
    profiles:
      - worker
    ports:
      - "${PAGEWRIGHT_WORKER_PORT:-8082}:8082"
    environment:
      - PAGEWRIGHT_WORKER_PORT=8082
      - PAGEWRIGHT_WORK_DIR=${PAGEWRIGHT_WORK_DIR:-/work}
      - PAGEWRIGHT_LLM_KEY=${PAGEWRIGHT_PROVIDER_TOKEN:-}
      - PAGEWRIGHT_LLM_URL=http://gateway:8087/v1
      - PAGEWRIGHT_LLM_MODEL=gpt-5.6-luna
      - PAGEWRIGHT_MANAGER_URL=${PAGEWRIGHT_MANAGER_URL:-http://manager:8081}
      - PAGEWRIGHT_STORAGE_URL=${PAGEWRIGHT_STORAGE_URL:-http://storage:8080}
      - PAGEWRIGHT_CODEX_BINARY=${PAGEWRIGHT_CODEX_BINARY:-/usr/local/bin/codex}
      - PAGEWRIGHT_INSTRUCTIONS_PATH=${PAGEWRIGHT_INSTRUCTIONS_PATH:-/.codex/instructions.md}
      - PAGEWRIGHT_JOB=${PAGEWRIGHT_JOB:-{}}
    depends_on:
      manager:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - pagewright
    restart: "no"

networks:
  pagewright:
    driver: bridge

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  # Historical name retained to preserve existing filesystem artifacts.
  nfs_data:
    driver: local
  www_data:
    driver: local
  nginx_config:
    driver: local
  pagewright_config:
    driver: local
