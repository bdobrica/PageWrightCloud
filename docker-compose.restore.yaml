# Use with root docker-compose.yaml, a NEW explicit -p project, a reviewed
# recovery env file and exact recorded image IDs. Never layer the pilot override.
# No public ingress, background job dispatch or provider calls during rehearsal.
services:
  gateway:
    restart: 'no'
    ports: !reset []
    entrypoint: [/bin/false]
    environment:
      PAGEWRIGHT_LLM_KEY: ''
      PAGEWRIGHT_AI_ALLOWANCE_CENTS: '0'
  manager:
    restart: 'no'
    entrypoint: [/bin/false]
    volumes: !reset []
  nginx:
    ports: !reset []
  ui:
    ports: !reset []
  redis:
    volumes:
      - type: volume
        source: redis_data
        target: /data
        volume: {nocopy: true}
  storage:
    volumes:
      - type: volume
        source: nfs_data
        target: /nfs
        volume: {nocopy: true}
  serving:
    volumes:
      - type: volume
        source: www_data
        target: /var/www
        volume: {nocopy: true}
      - type: volume
        source: nginx_config
        target: /etc/nginx/sites-enabled
        volume: {nocopy: true}
      - type: volume
        source: pagewright_config
        target: /etc/pagewright
        volume: {nocopy: true}
