# Explicit paid acceptance only; not part of CI or the application stack.
services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, always, --no-appendfsync-on-rewrite, 'no', --aof-load-truncated, 'no', --maxmemory-policy, noeviction, --save, '']
    tmpfs: [/data]
    networks: [smoke]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 30
  manager:
    build: ./pagewright/manager
    environment:
      PAGEWRIGHT_REDIS_ADDR: redis:6379
      PAGEWRIGHT_SERVICE_TOKEN: ${SMOKE_SERVICE_TOKEN:?}
      PAGEWRIGHT_MANAGER_URL: http://manager:8081
      PAGEWRIGHT_WORKER_NETWORK: ${COMPOSE_PROJECT_NAME}_smoke
      PAGEWRIGHT_WORKER_IMAGE: ${SMOKE_WORKER_IMAGE:?}
      PAGEWRIGHT_WORKER_LLM_MODEL: gpt-5.6-luna
      PAGEWRIGHT_WORKER_LLM_KEY: ${SMOKE_PROXY_TOKEN:?}
      PAGEWRIGHT_WORKER_LLM_URL: http://budget:8090/v1
      PAGEWRIGHT_WORKER_APPARMOR_PROFILE: ${SMOKE_APPARMOR_PROFILE:-}
      PAGEWRIGHT_DISPATCH_CONCURRENCY: '1'
    ports: ['127.0.0.1::8081']
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    networks: [smoke, control]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://localhost:8081/ready']
      interval: 2s
      retries: 30
  storage:
    build: ./pagewright/storage
    environment:
      PAGEWRIGHT_PORT: '8080'
      PAGEWRIGHT_SERVICE_TOKEN: ${SMOKE_SERVICE_TOKEN:?}
      PAGEWRIGHT_NFS_BASE_PATH: /nfs
      PAGEWRIGHT_MANAGER_URL: http://manager:8081
    ports: ['127.0.0.1::8080']
    tmpfs: [/nfs]
    networks: [smoke, control]
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://localhost:8080/ready']
      interval: 2s
      retries: 30
  budget:
    image: node:24.11.1-bookworm-slim
    user: ${SMOKE_UID:?}:${SMOKE_GID:?}
    command: [node, /opt/smoke/provider-budget.mjs]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      SMOKE_PROXY_TOKEN: ${SMOKE_PROXY_TOKEN:?}
      SMOKE_OFFLINE: ${SMOKE_OFFLINE:-0}
    volumes:
      - ./scripts/provider-budget.mjs:/opt/smoke/provider-budget.mjs:ro
      - ${SMOKE_STATE_DIR:?}:/state
    secrets: [provider_key]
    ports: ['127.0.0.1::8090']
    networks: [smoke, egress]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      retries: 30
networks:
  smoke:
    internal: true
  egress: {}
  control: {}
secrets:
  provider_key:
    file: ${SMOKE_KEY_FILE:?}
